steps:
  # Step 0: Install deps and gate the deploy on lint (no test script exists yet)
  - name: 'node:22'
    entrypoint: npm
    args: ['ci']

  - name: 'node:22'
    entrypoint: npm
    args: ['run', 'lint']

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_KEY=${_NEXT_PUBLIC_POSTHOG_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_POSTHOG_HOST=${_NEXT_PUBLIC_POSTHOG_HOST}'
      - '--build-arg'
      - 'NEXT_PUBLIC_GOOGLE_CLIENT_ID=${_NEXT_PUBLIC_GOOGLE_CLIENT_ID}'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/infoverse/infoverse-frontend:$COMMIT_SHA'
      - '.'

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/infoverse/infoverse-frontend:$COMMIT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'infoverse-frontend'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/infoverse/infoverse-frontend:$COMMIT_SHA'
      - '--region=europe-west1'
      - '--platform=managed'
      - '--allow-unauthenticated'

substitutions:
  _NEXT_PUBLIC_API_URL: 'https://infoverse-backend-84498540486.europe-west1.run.app/api/v1'
  _NEXT_PUBLIC_POSTHOG_KEY: 'phc_KuzbUNhO7RbVc1kkegikc6gROTB1Dm1az3FqI2bbiox'
  _NEXT_PUBLIC_POSTHOG_HOST: 'https://us.i.posthog.com'
  _NEXT_PUBLIC_GOOGLE_CLIENT_ID: '84498540486-5v3sppmrbca9s3phpngkvd8ir9s0fj9o.apps.googleusercontent.com'
options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/infoverse/infoverse-frontend:$COMMIT_SHA'
